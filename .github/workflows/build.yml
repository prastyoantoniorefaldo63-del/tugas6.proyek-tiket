
name: Build EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ aldo.cpp -o JokoTiket.exe

      - name: Simpan file EXE
        uses: actions/upload-artifact@v4
        with:
          name: JokoTiket
          path: JokoTiket.exe
